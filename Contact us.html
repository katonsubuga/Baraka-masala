<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

  header {
    background-color: #fff;
    border-bottom: 3px solid #f6b400;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    position: sticky; 
    top: 0; 
    z-index: 1000;
}
  

  header nav a {
    color: #38761d;
    margin-left: 25px;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s;
}
  header nav a:hover {
    color: #a45a2a;
}
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}
.container{
  max-width:600px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
h2{text-align:center;}
input, textarea, select, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:5px;
  border:1px solid #ccc;
}
button{
  background:#2e7d32;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{background:#1b5e20;}
#confirmation{
  display:none;
  margin-top:15px;
  color:green;
  font-weight:bold;
  text-align:center;
}
  footer {
    background-color: #343a40;
    color: white;
    text-align: center;
    padding: 20px 0;
    font-size: 0.9em;
</style>
</head>

<body>

<header>
     <nav>
      <a href="index.html">Home</a>
      <a href="about us.html">About us</a>
      <a href="contact us.html">Contact us</a>
    </nav>
  </div>
</header>
  

<div class="container">
<h2>🫖 Baraka Chai Masala – Order Form</h2>

<form id="orderForm"
      action="https://formsubmit.co/katoabdul737@gmail.com"
      method="POST">

<input type="text" name="Customer Name" placeholder="Full Name" required>
<input type="email" name="Email" placeholder="Email Address" required>
<input type="text" name="Phone" placeholder="Phone Number" required>
<input type="text" name="Location" placeholder="Delivery Location" required>

<select name="Product" required>
  <option value="">Select Product</option>
  <option>Baraka Chai Masala – 100g</option>
  <option>Baraka Chai Masala – 250g</option>
  <option>Baraka Chai Masala – 500g</option>
</select>

<input type="number" name="Quantity" placeholder="Quantity" min="1" required>

<textarea name="Order Details" placeholder="Additional instructions (optional)"></textarea>

<!-- FormSubmit settings -->
<input type="hidden" name="_subject" value="NEW ORDER – Baraka Chai Masala">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<button type="submit">Submit Order</button>
</form>

<p id="confirmation">
✅ Thank you! Your order has been submitted successfully.<br>
We will contact you shortly.
</p>

</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  const data = new FormData(this);
  let text = "NEW ORDER - BARAKA CHAI MASALA\n\n";
  for (let pair of data.entries()) {
    if(!pair[0].startsWith("_")){
      text += pair[0] + ": " + pair[1] + "\n";
    }
  }

  // Send to WhatsApp
  window.open(
    "https://wa.me/256774140531?text=" + encodeURIComponent(text),
    "_blank"
  );

  // Submit form to email
  fetch(this.action, {
    method: "POST",
    body: data,
    headers: { 'Accept': 'application/json' }
  });

  document.getElementById("confirmation").style.display = "block";
  this.reset();
});
</script>
<footer>
<p style="text-align:center;">&copy; 2025 Baraka Chai Masala | Uganda</p>
</footer>
</body>
</html>
