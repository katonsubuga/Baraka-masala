<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Get in Touch</title>
    <link rel="stylesheet" href="Contact_us_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header> 
<div class="container">
            <div class="logo">
                <span class="logo-icon"><img src="l2.jpg"></span>
                BARAKA CHAI MASALA 🇺🇬
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="About us.html">About us</a>
                <a href="Contact us.html">Contact us</a>
            </nav>
        </div>
      
    </header>

        <section class="contact-grid-section">
        <div class="container contact-grid">
            
            <div class="contact-details-box">
                <h2>Our Contact Channels</h2>
                <div class="detail-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <p><strong>Address:</strong>Mengo Along Side Kabaka Ajagala Road</p>
                </div>
                <div class="detail-item">
                    <i class="fas fa-phone-alt"></i>
                    <p><strong>Phone:</strong>+256782350634</p>
                </div>
                <div class="detail-item">
                    <i class="fas fa-envelope"></i>
                    <p><strong>Email:</strong>baraka256@gmail.com</p>
                </div>
                <div class="detail-item">
                    <i class="fas fa-clock"></i>
                    <p><strong>Hours:</strong>24/7</p>
                </div>

                <div class="map-placeholder">
                    <i class="fas fa-compass"></i>
                    <p>Find us on the map</p>
                </div>
            </div>

            <div class="contact-form-container">
                <h2>You Can Now Order</h2>
                <form action="#" method="POST" class="contact-form">
                    
                    <div class="form-row">
                        <input type="text" name="name" placeholder="Full Name" required>
                        <input type="email" name="email" placeholder="Email Address" required>
                         <input type="text" name="Location" placeholder="Location" required>
                        <input type="text" name="Contact" placeholder="Contact" required>
                    </div>

                    <textarea name="message" placeholder="Your detailed message or inquiry..." rows="7" required></textarea>
                    
                    <button type="submit" class="submit-button">Submit</button>
                </form>
            </div>

        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Baraka Chai Masala, Uganda. All Rights Reserved.</p>
        </div>
    </footer>

</body>

</html>
